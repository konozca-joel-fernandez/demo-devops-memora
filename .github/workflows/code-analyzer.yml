name: CI - Salesforce Code Analyzer

on:
  pull_request:
    branches:
      - dev
      - preprod
      - main
    paths:
      - 'force-app/**'

jobs:
  code-analyzer:
    name: Salesforce Code Analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install Salesforce Code Analyzer
        run: sf plugins install code-analyzer

      - name: Run Salesforce Code Analyzer (Strict)
        run: |
          sf code-analyzer run --workspace force-app --severity-threshold 2 --output-file code-analyzer-results.html

      - name: Subir Reporte HTML de Resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-results
          path: code-analyzer-results.html