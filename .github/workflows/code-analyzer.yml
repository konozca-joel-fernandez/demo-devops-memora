name: CI - Salesforce Code Analyzer

on:
  pull_request:
    branches:
      - dev
      - preprod
      - main
    paths:
      - 'force-app/**'

jobs:
  code-analyzer:
    name: Salesforce Code Analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install Salesforce Code Analyzer
        run: sf plugins install code-analyzer

      - name: Ejecutar Salesforce Code Analyzer
        continue-on-error: true
        run: |
          sf code-analyzer run --workspace force-app --severity-threshold 2 --output-file code-analyzer-results.json

      - name: Procesar Resumen y Anotaciones
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("code-analyzer-results.json")) process.exit(0);
            
            let rawData;
            try {
              rawData = JSON.parse(fs.readFileSync("code-analyzer-results.json", "utf8"));
            } catch(e) {
              process.exit(0);
            }

            let violations = [];

            // Normalización de la estructura JSON de Salesforce
            if (Array.isArray(rawData)) {
              rawData.forEach(fileItem => {
                const filePath = fileItem.fileName || fileItem.file || "";
                if (fileItem.violations && Array.isArray(fileItem.violations)) {
                  fileItem.violations.forEach(v => {
                    violations.push({
                      file: filePath || v.fileName || v.file || "N/A",
                      line: v.line || (v.locations && v.locations[0]?.line) || 1,
                      rule: v.ruleName || v.rule || "N/A",
                      severity: Number(v.severity) || 3,
                      message: v.message || ""
                    });
                  });
                }
              });
            } else if (rawData && typeof rawData === "object") {
              const list = rawData.violations || rawData.results || [];
              list.forEach(v => {
                violations.push({
                  file: v.fileName || v.file || (v.location && v.location.file) || "N/A",
                  line: v.line || (v.location && v.location.line) || 1,
                  rule: v.ruleName || v.rule || "N/A",
                  severity: Number(v.severity) || 3,
                  message: v.message || ""
                });
              });
            }

            // Separación entre Errores (Gravedad 1 y 2) y Warnings (Gravedad 3 o superior)
            const errors = violations.filter(v => v.severity <= 2);
            const warnings = violations.filter(v => v.severity > 2);

            let summary = "## 🛡️ Resultado de Salesforce Code Analyzer\n\n";

            if (violations.length === 0) {
              summary += "✅ **¡Código limpio! No se han encontrado violaciones.**\n";
            } else {
              // Tabla 1: Errores que bloquean
              summary += `### ⛔ Errores Críticos (Obligatorio Corregir para Aprobar PR): ${errors.length}\n`;
              if (errors.length > 0) {
                summary += "| Severidad | Archivo | Línea | Regla | Descripción |\n";
                summary += "| :--- | :--- | :--- | :--- | :--- |\n";
                errors.forEach(e => {
                  const sevStr = e.severity === 1 ? "🔴 Alta" : "🟠 Media";
                  const cleanFile = e.file.replace(/^.*force-app/, "force-app");
                  summary += `| ${sevStr} | \`${cleanFile}\` | ${e.line} | \`${e.rule}\` | ${e.message} |\n`;
                  
                  // Marcado en rojo directamente en el código de la PR
                  console.log(`::error file=${cleanFile},line=${e.line}::[${e.rule}] ${e.message}`);
                });
              } else {
                summary += "*No hay errores críticos que bloqueen la PR.*\n";
              }

              summary += "\n---\n\n";

              // Tabla 2: Warnings informativos
              summary += `### ⚠️ Advertencias / Warnings (Informativos - No Bloquean): ${warnings.length}\n`;
              if (warnings.length > 0) {
                summary += "| Severidad | Archivo | Línea | Regla | Descripción |\n";
                summary += "| :--- | :--- | :--- | :--- | :--- |\n";
                warnings.forEach(w => {
                  const sevStr = w.severity === 3 ? "🟡 Baja" : "⚪ Info";
                  const cleanFile = w.file.replace(/^.*force-app/, "force-app");
                  summary += `| ${sevStr} | \`${cleanFile}\` | ${w.line} | \`${w.rule}\` | ${w.message} |\n`;
                  
                  // Marcado en amarillo directamente en el código de la PR
                  console.log(`::warning file=${cleanFile},line=${w.line}::[${w.rule}] ${w.message}`);
                });
              } else {
                summary += "*No hay advertencias recomendadas.*\n";
              }
            }

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

            // Si hay errores de gravedad 1 o 2, la pipeline falla y bloquea el Merge
            if (errors.length > 0) process.exit(1);
          '

      - name: Subir Reporte JSON como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-results
          path: code-analyzer-results.json