name: CI - Salesforce Code Analyzer

on:
  pull_request:
    branches:
      - dev
      - preprod
      - main
    paths:
      - 'force-app/**'

jobs:
  code-analyzer:
    name: Salesforce Code Analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install Salesforce Code Analyzer
        run: sf plugins install code-analyzer

      - name: Ejecutar Salesforce Code Analyzer
        continue-on-error: true
        run: |
          sf code-analyzer run --workspace force-app --severity-threshold 2 --output-file code-analyzer-results.json

      - name: Generar Anotaciones Visiales y Resumen
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("code-analyzer-results.json")) process.exit(0);
            const data = JSON.parse(fs.readFileSync("code-analyzer-results.json", "utf8"));
            
            let summary = "### 🚨 Resultado de Salesforce Code Analyzer\n\n";
            summary += "| Severidad | Archivo | Línea | Regla | Mensaje |\n";
            summary += "| :--- | :--- | :--- | :--- | :--- |\n";
            
            let hasErrors = false;
            if (data.violations && data.violations.length > 0) {
              data.violations.forEach(v => {
                const sevLabel = v.severity === 1 ? "🔴 Alta" : v.severity === 2 ? "🟠 Media" : "🟡 Baja";
                summary += `| ${sevLabel} | \`${v.fileName}\` | ${v.line} | \`${v.ruleName}\` | ${v.message} |\n`;
                
                // Crear anotación visual roja directamente en las líneas de código de la PR
                console.log(`::error file=${v.fileName},line=${v.line}::[${v.ruleName}] ${v.message}`);
                if (v.severity <= 2) hasErrors = true;
              });
            } else {
              summary += "| ✅ | - | - | - | No se encontraron violaciones |\n";
            }
            
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            if (hasErrors) process.exit(1);
          '

      - name: Subir Reporte HTML como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-results
          path: code-analyzer-results.json