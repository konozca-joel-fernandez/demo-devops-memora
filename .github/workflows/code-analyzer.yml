name: CI - Validación de PR y Calidad de Código

on:
  pull_request:
    branches:
      - dev
      - preprod
      - main
    paths:
      - 'force-app/**'
      - 'tests_to_run.txt'

jobs:
  code-analyzer:
    name: 1. Salesforce Code Analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install Salesforce Code Analyzer
        run: sf plugins install code-analyzer

      - name: Ejecutar Salesforce Code Analyzer
        continue-on-error: true
        run: |
          # 1. Buscamos archivos Añadidos (A) o Modificados (M) ignorando los borrados
          # y filtramos solo por las extensiones que lee el Code Analyzer
          CHANGED_FILES=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD | grep -iE '\.(cls|trigger|js|ts|html|page|cmp)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "⏭️ No se han modificado archivos analizables en esta PR. Saltando el escaneo."
            
            # Avisamos a Node.js de que no hubo ejecución
            echo "SKIP_ANALYZER=true" >> $GITHUB_ENV
            
            # Creamos un JSON vacío para que el script de Node no falle
            echo '[]' > code-analyzer-results.json
          else
            # 2. Convertimos la lista de archivos en un texto separado por comas
            TARGETS=$(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//')
            echo "🔍 Analizando únicamente los siguientes archivos:"
            echo "$TARGETS"
            
            # 3. Lanzamos el Analyzer SOLO contra los archivos modificados (--target)
            sf code-analyzer run --target "$TARGETS" --severity-threshold 2 --output-file code-analyzer-results.json
          fi

      - name: Procesar Resumen de Calidad
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            
            // --- NUEVO BLOQUE: Interceptar si se saltó el escaneo ---
            if (process.env.SKIP_ANALYZER === "true") {
              let summary = "## 🛡️ Resultado de Salesforce Code Analyzer\n\n";
              summary += "⏭️ **Escaneo omitido.** *No se han detectado modificaciones en archivos analizables (`.cls`, `.js`, `.html`, etc.) en esta PR.*\n";
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
              process.exit(0);
            }
            // --------------------------------------------------------

            if (!fs.existsSync("code-analyzer-results.json")) process.exit(0);
            
            let rawData;
            try {
              rawData = JSON.parse(fs.readFileSync("code-analyzer-results.json", "utf8"));
            } catch(e) {
              process.exit(0);
            }

            function getFile(v, parent) {
              let f = v.fileName || v.file || v.path || v.resource;
              if (!f && v.location) f = v.location.file || v.location.fileName || v.location.path;
              if (!f && v.locations && v.locations[0]) f = v.locations[0].file || v.locations[0].fileName || v.locations[0].path;
              if (!f && parent) f = parent.fileName || parent.file || parent.path;
              if (!f) f = "N/A";
              return f.includes("force-app") ? "force-app" + f.split("force-app")[1] : f;
            }

            function getLine(v) {
              let l = v.line || v.startLine || v.lineNumber;
              if (!l && v.location) l = v.location.line || v.location.startLine;
              if (!l && v.locations && v.locations[0]) {
                const loc = v.locations[0];
                l = loc.line || loc.startLine || loc.lineNumber || (loc.lineRange && loc.lineRange.start && loc.lineRange.start.line);
              }
              return Number(l) || 1;
            }

            let violations = [];

            function processItem(v, parent) {
              violations.push({
                file: getFile(v, parent),
                line: getLine(v),
                rule: v.ruleName || v.rule || "N/A",
                severity: Number(v.severity) || 3,
                message: v.message || ""
              });
            }

            if (Array.isArray(rawData)) {
              rawData.forEach(item => {
                const list = item.violations || item.results || [];
                if (Array.isArray(list) && list.length > 0) {
                  list.forEach(v => processItem(v, item));
                } else if (item.ruleName || item.rule || item.severity) {
                  processItem(item, null);
                }
              });
            } else if (rawData && typeof rawData === "object") {
              const list = rawData.violations || rawData.results || rawData.runs || [];
              if (Array.isArray(list)) {
                list.forEach(item => {
                  if (item.violations && Array.isArray(item.violations)) {
                    item.violations.forEach(v => processItem(v, item));
                  } else {
                    processItem(item, null);
                  }
                });
              }
            }

            const errors = violations.filter(v => v.severity <= 2);
            const warnings = violations.filter(v => v.severity > 2);

            let summary = "## 🛡️ Resultado de Salesforce Code Analyzer\n\n";

            if (violations.length === 0) {
              summary += "✅ **¡Código limpio! No se han encontrado violaciones.**\n";
            } else {
              summary += `### ⛔ Errores Críticos (Obligatorio Corregir para Aprobar PR): ${errors.length}\n`;
              if (errors.length > 0) {
                summary += "| Severidad | Archivo | Línea | Regla | Descripción |\n";
                summary += "| :--- | :--- | :--- | :--- | :--- |\n";
                errors.forEach(e => {
                  const sevStr = e.severity === 1 ? "🔴 Alta" : "🟠 Media";
                  summary += `| ${sevStr} | \`${e.file}\` | ${e.line} | \`${e.rule}\` | ${e.message} |\n`;
                });
              } else {
                summary += "*No hay errores críticos que bloqueen la PR.*\n";
              }

              summary += "\n---\n\n";

              summary += `### ⚠️ Advertencias / Warnings (Informativos - No Bloquean): ${warnings.length}\n`;
              if (warnings.length > 0) {
                summary += "| Severidad | Archivo | Línea | Regla | Descripción |\n";
                summary += "| :--- | :--- | :--- | :--- | :--- |\n";
                warnings.forEach(w => {
                  const sevStr = w.severity === 3 ? "🟡 Baja" : "⚪ Info";
                  summary += `| ${sevStr} | \`${w.file}\` | ${w.line} | \`${w.rule}\` | ${w.message} |\n`;
                });
              } else {
                summary += "*No hay advertencias recomendadas.*\n";
              }
            }

            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

            if (errors.length > 0) process.exit(1);
          '

  validate-deployment:
        name: 2. Validación de Despliegue y Tests Apex
        runs-on: ubuntu-latest

        steps:
          # 1. ACTUALIZACIÓN: fetch-depth: 0 es necesario para poder comparar ramas con git diff
          - name: Checkout del repositorio
            uses: actions/checkout@v4
            with:
              fetch-depth: 0 

          - name: Instalar Node.js
            uses: actions/setup-node@v4
            with:
              node-version: '22'

          - name: Instalar Salesforce CLI
            run: npm install --global @salesforce/cli

          - name: Reconstruir llave privada (server.key)
            run: echo "${{ secrets.SF_DEV_SERVER_KEY }}" > server.key

          - name: Autenticación en Salesforce (Dev)
            run: sf org login jwt --client-id ${{ secrets.SF_DEV_CLIENT_ID }} --jwt-key-file server.key --username ${{ secrets.SF_DEV_USERNAME }} --set-default --alias dev-org --instance-url https://login.salesforce.com

          - name: Eliminar llave privada por seguridad
            if: always()
            run: rm -f server.key
          
          - name: Instalar plugin sfdx-git-delta
            run: echo y | sf plugins install sfdx-git-delta

          - name: Generar Delta de metadatos
            run: |
              mkdir -p delta
              sf sgd source delta --to HEAD --from origin/${{ github.base_ref }} --output delta/
              echo "📂 Metadatos aislados en el Delta:"
              ls -la delta/ || true

          # 2. ACTUALIZACIÓN: Comprobar cambios en Apex antes de lanzar tests
          - name: Validar Metadatos y Ejecutar Tests (Dry-Run)
            run: |
              APEX_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -iE '\.cls$|\.trigger$' || true)

              # Si existe la carpeta delta/force-app usamos solo el delta; si no, force-app completo
              SOURCE_DIR="force-app"
              if [ -d "delta/force-app" ]; then
                SOURCE_DIR="delta/force-app"
              fi

              echo "📦 Directorio a enviar a Salesforce: $SOURCE_DIR"

              if [ -n "$APEX_CHANGED" ]; then
                echo "🔄 Cambios detectados en código Apex:"
                echo "$APEX_CHANGED"
                
                if [ -f "tests_to_run.txt" ] && [ -s "tests_to_run.txt" ]; then
                  TESTS=$(cat tests_to_run.txt | tr '\r\n' ' ' | xargs)
                  echo "🧪 Validando cambios y ejecutando tests especificados: $TESTS"
                  
                  echo "TEST_STATUS=EXECUTED" >> $GITHUB_ENV
                  echo "EXECUTED_TESTS=$TESTS" >> $GITHUB_ENV
                  sf project deploy validate --target-org dev-org --source-dir "$SOURCE_DIR" --test-level RunSpecifiedTests --tests $TESTS --json > deploy-result.json || true
                else
                  echo "⚠️ Hay cambios en Apex pero tests_to_run.txt está vacío. Validando sin tests..."
                  
                  echo "TEST_STATUS=NO_TESTS_FILE" >> $GITHUB_ENV
                  sf project deploy validate --target-org dev-org --source-dir "$SOURCE_DIR" --json > deploy-result.json || true
                fi
              else
                echo "⏭️ No se han detectado cambios en código Apex. Saltando la ejecución de unit tests."
                echo "📦 Validando únicamente el despliegue de metadatos del Delta..."
                
                echo "TEST_STATUS=NO_APEX" >> $GITHUB_ENV
                sf project deploy validate --target-org dev-org --source-dir "$SOURCE_DIR" --json > deploy-result.json || true
              fi

          - name: Procesar Resumen de Validación y Tests
            if: always()
            run: |
              node -e '
                const fs = require("fs");
                let summary = "## 🧪 Resultado de Validación en Salesforce\n\n";

                if (!fs.existsSync("deploy-result.json")) {
                  summary += "❌ **Error Crítico:** No se pudo generar el archivo de resultados de la CLI de Salesforce.\n";
                  fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
                  process.exit(1);
                }

                let rawData;
                try {
                  rawData = JSON.parse(fs.readFileSync("deploy-result.json", "utf8"));
                } catch(e) {
                  summary += "❌ **Error:** No se pudo procesar la respuesta JSON de Salesforce.\n";
                  fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
                  process.exit(1);
                }

                const status = rawData.status;
                const res = rawData.result || {};
                const details = res.details || res;

                const compFailures = details.componentFailures ? (Array.isArray(details.componentFailures) ? details.componentFailures : [details.componentFailures]) : [];
                let testFailures = [];
                if (details.runTestResult && details.runTestResult.failures) {
                  testFailures = Array.isArray(details.runTestResult.failures) ? details.runTestResult.failures : [details.runTestResult.failures];
                }

                let hasErrors = false;
                const testStatus = process.env.TEST_STATUS || "UNKNOWN";

                if (status === 0 && compFailures.length === 0 && testFailures.length === 0) {
                  // Mensajes dinámicos según el estado de la ejecución
                  if (testStatus === "EXECUTED") {
                    summary += "✅ **¡Validación de metadatos y Tests Apex completados con éxito!**\n";
                    const executedTests = process.env.EXECUTED_TESTS || "";
                    if (executedTests) {
                      summary += "### 🧪 Clases de Test Ejecutadas:\n";
                      // Convertimos el string separado por espacios en una lista de Markdown
                      executedTests.split(" ").filter(Boolean).forEach(t => {
                        summary += `- \`${t}\`\n`;
                      });
                      summary += "\n";
                    }
                  } else if (testStatus === "NO_APEX") {
                    summary += "✅ **¡Validación de metadatos completada con éxito!**\n\n";
                    summary += "⏭️ *Se ha omitido la ejecución de Unit Tests porque no se detectaron modificaciones en archivos de Apex (`.cls` o `.trigger`).*\n";
                  } else if (testStatus === "NO_TESTS_FILE") {
                    summary += "✅ **¡Validación de metadatos completada con éxito!**\n\n";
                    summary += "⚠️ *Atención: Se ha modificado código Apex, pero no se ejecutaron pruebas porque el archivo `tests_to_run.txt` estaba vacío o no existía.*\n";
                  } else {
                    summary += "✅ **¡Validación completada con éxito en Salesforce!**\n";
                  }
                } else {
                  hasErrors = true;

                  if (rawData.message || rawData.errorMessage || (compFailures.length === 0 && testFailures.length === 0)) {
                    const topError = rawData.message || rawData.errorMessage || res.message || "Error general de despliegue o parámetro no válido.";
                    summary += `### 🛑 Error General de Despliegue / CLI\n`;
                    summary += `> **Detalle del fallo:** ${topError}\n\n`;
                  }

                  if (compFailures.length > 0) {
                    summary += `### ❌ Errores de Compilación / Metadatos (${compFailures.length})\n`;
                    summary += "| Archivo / Componente | Línea | Tipo | Problema |\n";
                    summary += "| :--- | :--- | :--- | :--- |\n";
                    compFailures.forEach(f => {
                      const file = f.fileName || f.fullName || "N/A";
                      const line = f.lineNumber || "-";
                      const type = f.problemType || "Error";
                      const prob = (f.problem || "").replace(/\n/g, "<br>");
                      summary += `| \`${file}\` | ${line} | ${type} | ${prob} |\n`;
                    });
                    summary += "\n---\n\n";
                  }

                  if (testFailures.length > 0) {
                    summary += `### 💥 Errores en Tests Apex (${testFailures.length})\n`;
                    summary += "| Clase Test | Método | Mensaje de Error |\n";
                    summary += "| :--- | :--- | :--- |\n";
                    testFailures.forEach(t => {
                      const cls = t.name || "N/A";
                      const method = t.methodName || "N/A";
                      const msg = (t.message || "").replace(/\n/g, "<br>");
                      summary += `| \`${cls}\` | \`${method}\` | ${msg} |\n`;
                    });
                  }
                }

                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

                if (hasErrors) process.exit(1);
              '
