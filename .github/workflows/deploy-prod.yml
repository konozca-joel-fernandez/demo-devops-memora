name: CD - Despliegue a PRODUCCIÓN

on:
  push:
    branches:
      - main
    paths:
      - 'force-app/**'

jobs:
  # ============================================================
  # JOB 1: PRODUCCIÓN (SE EJECUTA SIEMPRE AL MERGEAR A MAIN)
  # ============================================================
  deploy-prod:
    name: 1. Despliegue a Producción (PROD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Salesforce CLI y Plugin Delta
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-git-delta

      - name: Autenticación en Salesforce (PROD)
        env:
          KEY_PROD: ${{ secrets.SF_PROD_SERVER_KEY }}
        run: |
          echo "$KEY_PROD" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_PROD_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_PROD_USERNAME }} \
            --set-default \
            --alias prod-org \
            --instance-url https://login.salesforce.com
          rm -f server.key

      - name: Generar Delta del Merge
        run: |
          git config core.autocrlf input
          rm -rf delta
          mkdir -p delta
          
          sf sgd source delta \
            --from "${{ github.event.before }}" \
            --to "${{ github.sha }}" \
            --generate-delta \
            --output-dir delta

      - name: Desplegar a Producción (RunLocalTests)
        run: |
          DEPLOY_ARGS=(
            --target-org prod-org
            --manifest delta/package/package.xml
            --test-level RunLocalTests
          )

          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then
            DEPLOY_ARGS+=(--post-destructiveChanges delta/destructiveChanges/destructiveChanges.xml)
          fi

          if grep -q "<types>" delta/package/package.xml; then
            echo "🚀 Desplegando Delta en Producción..."
            sf project deploy start "${DEPLOY_ARGS[@]}" --json > deploy-result.json || true
          else
            echo "⏭️ No hay cambios de metadatos en el Delta."
          fi

  # ============================================================
  # JOB 2: HOTFIX (SOLO SI EL MERGE NO VIENE DE HOTFIX/*)
  # ============================================================
  deploy-hotfix:
    name: 2. Sincronización a Org Hotfix (HOTFIX)
    if: "!contains(github.event.head_commit.message, 'hotfix/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Salesforce CLI y Plugin Delta
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-git-delta

      - name: Autenticación en Salesforce (HOTFIX)
        env:
          KEY_HOTFIX: ${{ secrets.SF_HOTFIX_SERVER_KEY }}
        run: |
          echo "$KEY_HOTFIX" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_HOTFIX_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_HOTFIX_USERNAME }} \
            --set-default \
            --alias hotfix-org \
            --instance-url https://test.salesforce.com
          rm -f server.key

      - name: Generar Delta del Merge
        run: |
          git config core.autocrlf input
          rm -rf delta
          mkdir -p delta
          
          sf sgd source delta \
            --from "${{ github.event.before }}" \
            --to "${{ github.sha }}" \
            --generate-delta \
            --output-dir delta

      - name: Desplegar a Hotfix
        run: |
          DEPLOY_ARGS=(
            --target-org hotfix-org
            --manifest delta/package/package.xml
            --test-level NoTestRun
          )

          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then
            DEPLOY_ARGS+=(--post-destructiveChanges delta/destructiveChanges/destructiveChanges.xml)
          fi

          if grep -q "<types>" delta/package/package.xml; then
            echo "🚀 Desplegando Delta en Hotfix..."
            sf project deploy start "${DEPLOY_ARGS[@]}" --json > deploy-result-hotfix.json || true
          else
            echo "⏭️ No hay cambios de metadatos en el Delta."
          fi

  # ============================================================
  # JOB 3: BACKPORT A DEV (SOLO SI EL MERGE VIENE DE HOTFIX/*)
  # ============================================================
  deploy-dev:
    name: 2. Backport a Entorno de Desarrollo (DEV)
    if: "contains(github.event.head_commit.message, 'hotfix/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Salesforce CLI y Plugin Delta
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-git-delta

      - name: Autenticación en Salesforce (DEV)
        env:
          KEY_DEV: ${{ secrets.SF_DEV_SERVER_KEY }}
        run: |
          echo "$KEY_DEV" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_DEV_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_DEV_USERNAME }} \
            --set-default \
            --alias dev-org \
            --instance-url https://login.salesforce.com
          rm -f server.key

      - name: Generar Delta del Merge
        run: |
          git config core.autocrlf input
          rm -rf delta
          mkdir -p delta
          
          sf sgd source delta \
            --from "${{ github.event.before }}" \
            --to "${{ github.sha }}" \
            --generate-delta \
            --output-dir delta

      - name: Desplegar a DEV
        run: |
          DEPLOY_ARGS=(
            --target-org dev-org
            --manifest delta/package/package.xml
            --test-level NoTestRun
          )

          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then
            DEPLOY_ARGS+=(--post-destructiveChanges delta/destructiveChanges/destructiveChanges.xml)
          fi

          if grep -q "<types>" delta/package/package.xml; then
            echo "🚀 Sincronizando hotfix urgente en la org de DEV..."
            sf project deploy start "${DEPLOY_ARGS[@]}" --json > deploy-result-dev.json || true
          else
            echo "⏭️ No hay cambios de metadatos en el Delta."
          fi