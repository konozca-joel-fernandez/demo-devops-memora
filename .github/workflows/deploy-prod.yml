name: CD - Despliegue a PRODUCCIÓN

on:
  push:
    branches:
      - main
    paths:
      - 'force-app/**'

jobs:
  # ============================================================
  # JOB 1: PRODUCCIÓN (SE EJECUTA SIEMPRE AL MERGEAR A MAIN)
  # ============================================================
  deploy-prod:
    name: 1. Despliegue a Producción (PROD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Salesforce CLI y Plugin Delta
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-git-delta

      - name: Autenticación en Salesforce (PROD)
        env:
          KEY_PROD: ${{ secrets.SF_PROD_SERVER_KEY }}
        run: |
          echo "$KEY_PROD" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_PROD_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_PROD_USERNAME }} \
            --set-default \
            --alias prod-org \
            --instance-url https://login.salesforce.com
          rm -f server.key

      - name: Generar Delta del Merge
        run: |
          git config core.autocrlf input
          rm -rf delta
          mkdir -p delta
          
          sf sgd source delta \
            --from "${{ github.event.before }}" \
            --to "${{ github.sha }}" \
            --generate-delta \
            --output-dir delta

      - name: Desplegar a Producción (RunLocalTests)
        run: |
          PACKAGE_HAS_CHANGES=false
          DESTRUCTIVE_HAS_CHANGES=false

          if grep -q "<types>" delta/package/package.xml; then
            PACKAGE_HAS_CHANGES=true
          fi

          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then
            DESTRUCTIVE_HAS_CHANGES=true
          fi

          if [ "$PACKAGE_HAS_CHANGES" = false ] && [ "$DESTRUCTIVE_HAS_CHANGES" = false ]; then
            echo "⏭️ No hay cambios de metadatos ni eliminaciones en el Delta."
            exit 0
          fi

          DEPLOY_ARGS=(
            --target-org prod-org
            --manifest delta/package/package.xml
            --test-level RunLocalTests
          )

          if [ "$DESTRUCTIVE_HAS_CHANGES" = true ]; then
            echo "🗑️ Se han detectado componentes eliminados para Producción."
            DEPLOY_ARGS+=(--post-destructive-changes delta/destructiveChanges/destructiveChanges.xml)
          fi

          echo "🚀 Desplegando Delta en Producción..."
          sf project deploy start "${DEPLOY_ARGS[@]}" --json > deploy-result.json || true

  # ============================================================
  # JOB 2: HOTFIX (SOLO SI EL MERGE NO VIENE DE HOTFIX/*)
  # ============================================================
  deploy-hotfix:
    name: 2. Sincronización a Org Hotfix (HOTFIX)
    if: "!contains(github.event.head_commit.message, 'hotfix/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Salesforce CLI y Plugin Delta
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-git-delta

      - name: Autenticación en Salesforce (HOTFIX)
        env:
          KEY_HOTFIX: ${{ secrets.SF_HOTFIX_SERVER_KEY }}
        run: |
          echo "$KEY_HOTFIX" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_HOTFIX_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SF_HOTFIX_USERNAME }} \
            --set-default \
            --alias hotfix-org \
            --instance-url https://test.salesforce.com
          rm -f server.key

      - name: Generar Delta del Merge
        run: |
          git config core.autocrlf input
          rm -rf delta
          mkdir -p delta
          
          sf sgd source delta \
            --from "${{ github.event.before }}" \
            --to "${{ github.sha }}" \
            --generate-delta \
            --output-dir delta

      - name: Desplegar a Hotfix
        run: |
          DEPLOY_ARGS=(
            --target-org hotfix-org
            --manifest delta/package/package.xml
            --test-level NoTestRun
          )

          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then
            DEPLOY_ARGS+=(--post-destructiveChanges delta/destructiveChanges/destructiveChanges.xml)
          fi

          if grep -q "<types>" delta/package/package.xml; then
            echo "🚀 Desplegando Delta en Hotfix..."
            sf project deploy start "${DEPLOY_ARGS[@]}" --json > deploy-result-hotfix.json || true
          else
            echo "⏭️ No hay cambios de metadatos en el Delta."
          fi

  # ============================================================
  # JOB 3: BACKPORT A DEV (PR DESDE LA RAMA HOTFIX)
  # ============================================================
  backport-dev:
    name: 3. Backport a DEV (PR desde Hotfix)
    if: "contains(github.event.head_commit.message, 'hotfix/')"
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer rama Hotfix y crear PR hacia DEV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Detectar el nombre de la rama hotfix/xxx en el mensaje del commit
          HOTFIX_BRANCH=$(echo "${{ github.event.head_commit.message }}" | grep -oE 'hotfix/[a-zA-Z0-9._-]+' | head -n 1)

          if [ -z "$HOTFIX_BRANCH" ]; then
            echo "❌ No se pudo determinar el nombre de la rama hotfix."
            exit 1
          fi

          echo "📌 Rama hotfix detectada: $HOTFIX_BRANCH"

          # Comprobar si ya existe una PR abierta desde esa rama específica a dev
          PR_EXISTS=$(gh pr list --base dev --head "$HOTFIX_BRANCH" --state open --json number --jq 'length')
          
          if [ "$PR_EXISTS" -gt "0" ]; then
            echo "⏭️ Ya existe una Pull Request abierta desde $HOTFIX_BRANCH hacia dev."
          else
            echo "🚀 Creando Pull Request desde $HOTFIX_BRANCH a dev..."
            gh pr create \
              --base dev \
              --head "$HOTFIX_BRANCH" \
              --title "🚀 Backport: $HOTFIX_BRANCH a Dev" \
              --body "PR automática para integrar las correcciones de \`$HOTFIX_BRANCH\` en la rama \`dev\`."
          fi