name: CD - Despliegue a Dev

on:
  push:
    branches:
      - dev
    paths:
      - 'force-app/**'
      - 'tests_to_run.txt'

jobs:
  deploy-dev:
    name: Despliegue en Entorno Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Reconstruir llave privada (server.key)
        run: echo "${{ secrets.SF_DEV_SERVER_KEY }}" > server.key

      - name: Autenticación en Salesforce (Dev)
        run: sf org login jwt --client-id ${{ secrets.SF_DEV_CLIENT_ID }} --jwt-key-file server.key --username ${{ secrets.SF_DEV_USERNAME }} --set-default --alias dev-org --instance-url https://login.salesforce.com

      - name: Desplegar metadatos y ejecutar Tests
        run: |
          # Verificar si el archivo existe y no está vacío
          if [ -f "tests_to_run.txt" ] && [ -s "tests_to_run.txt" ]; then
            # Convertir el contenido del archivo en una lista separada por espacios
            TESTS=$(cat tests_to_run.txt | tr '\r\n' ' ' | xargs)
            echo "🚀 Ejecutando tests específicos: $TESTS"
            sf project deploy start --target-org dev-org --test-level RunSpecifiedTests --tests $TESTS --ignore-conflicts
          else
            echo "⚠️ No se especificaron tests en tests_to_run.txt. Desplegando sin tests."
            sf project deploy start --target-org dev-org --ignore-conflicts
          fi